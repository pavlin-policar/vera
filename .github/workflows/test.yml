name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          pip install .
          pip install pytest
      - name: Run tests
        run: pytest tests/

  packaging:
    # Build a wheel, install it, and import it from outside the repo to catch
    # missing subpackages or undeclared dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel
        run: |
          pip install build
          python -m build
      - name: Install wheel and smoke-test import
        run: |
          pip install dist/*.whl
          cd /tmp && python -c "import vera"
